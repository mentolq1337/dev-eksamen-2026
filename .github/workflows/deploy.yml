name: Build and push to ECR

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: 244530008913.dkr.ecr.eu-west-1.amazonaws.com
          ECR_REPO: wishifai-tomek
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:${{ github.sha }} \
                       -t $ECR_REGISTRY/$ECR_REPO:latest .
          docker push $ECR_REGISTRY/$ECR_REPO:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPO:latest

  terraform:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check
      - run: terraform init
      - run: terraform apply -auto-approve -var="image_tag=${{ github.sha }}"cd /workspaces/dev-eksamen-2026
cd infra
terraform fmt
cd ..
git add .github/workflows/deploy.yml infra/main.tf README_SVAR.md
git commit -m "Add terraform job to workflow"
git push